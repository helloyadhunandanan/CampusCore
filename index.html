<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <nav class="navbar">
        <div class="logo">NEXUS<span class="dot">.</span></div>
        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Resources</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <button class="btn-login" id="navLoginBtn">Student Login</button>
        
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Manage Campus <br> <span class="gradient-text">At Light Speed</span></h1>
            <p class="hero-subtitle">The ultimate platform for reserving labs, borrowing equipment, and tracking campus assets seamlessly.</p>
            <button class="btn-primary">Book a Resource <i class="fa-solid fa-arrow-right"></i></button>
                <button class="btn-secondary">View Catalog</button>
        </div>
    </header>

    <div class="modal-overlay" id="authModal">
        <div class="modal-glass">
            <button class="close-btn" id="closeAuth">&times;</button>
            
            <div id="loginView">
                <h2>Student Login</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="text" placeholder="student@nexus.edu" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary full-width">Sign In</button>
                    <div class="auth-toggle">
                        <p>New to Nexus? <span id="toRegister">Create Account</span></p>
                    </div>
                </form>
            </div>

            <div id="registerView" style="display: none;">
                <h2>Create Account</h2>
                <form id="registerForm">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="Sidharth" required>
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="sid@nexus.edu" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary full-width">Sign Up</button>
                    <div class="auth-toggle">
                        <p>Already have an account? <span id="toLogin">Login here</span></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Success! 🚀</div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
